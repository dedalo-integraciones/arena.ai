<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portadas por rubro — 573×253</title>
<style>
  :root { --bg:#0e0f11; --card:#17191d; --txt:#f2f3f5; --dim:#9aa0a6; --accent:#ff6b35; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 24px 64px; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { max-width:1240px; margin:0 auto 32px; }
  h1 { font-size:24px; margin:0 0 8px; letter-spacing:-.02em; }
  p  { margin:0; color:var(--dim); font-size:14px; }
  .grid { max-width:1240px; margin:0 auto; display:flex; flex-wrap:wrap; gap:28px; }
  .card { width:573px; max-width:100%; }
  .card img { display:block; width:573px; height:253px; max-width:100%;
              border-radius:12px; object-fit:cover; background:#222; }
  .meta { display:flex; align-items:baseline; justify-content:space-between;
          padding:12px 4px 0; border-top:1px solid #24272c; margin-top:12px; }
  .name { font-size:16px; font-weight:600; }
  .spec { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .file { font-size:12px; color:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>
<body>
<header>
  <h1>Portadas por rubro — 573 × 253 px</h1>
  <p>5 imágenes horizontales, calidad fotográfica profesional, listas para web (JPG optimizado, progresivo, sRGB).</p>
</header>

<div class="grid">
  <figure class="card" style="margin:0">
    <img src="hamburgueseria.jpg" alt="Portada de hamburguesería: hamburguesa gourmet doble con queso y papas fritas">
    <figcaption class="meta"><span class="name">Hamburguesería</span><span class="spec">573×253 · 40 KB</span></figcaption>
    <div class="file">hamburgueseria.jpg</div>
  </figure>

  <figure class="card" style="margin:0">
    <img src="pizzeria.jpg" alt="Portada de pizzería: pizza napolitana a la piedra con albahaca y horno a leña">
    <figcaption class="meta"><span class="name">Pizzería</span><span class="spec">573×253 · 40 KB</span></figcaption>
    <div class="file">pizzeria.jpg</div>
  </figure>

  <figure class="card" style="margin:0">
    <img src="minutas.jpg" alt="Portada de minutas: milanesa a la napolitana con papas fritas, huevo y gaseosa">
    <figcaption class="meta"><span class="name">Minutas</span><span class="spec">573×253 · 52 KB</span></figcaption>
    <div class="file">minutas.jpg</div>
  </figure>

  <figure class="card" style="margin:0">
    <img src="sushi.jpg" alt="Portada de sushi: nigiris de salmón y atún con rolls, wasabi y jengibre">
    <figcaption class="meta"><span class="name">Sushi</span><span class="spec">573×253 · 44 KB</span></figcaption>
    <div class="file">sushi.jpg</div>
  </figure>

  <figure class="card" style="margin:0">
    <img src="cafeteria.jpg" alt="Portada de cafetería: capuchino con latte art, medialuna y granos de café">
    <figcaption class="meta"><span class="name">Cafetería</span><span class="spec">573×253 · 48 KB</span></figcaption>
    <div class="file">cafeteria.jpg</div>
  </figure>
</div>
</body>
</html>
